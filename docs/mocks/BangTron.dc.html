<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--accent:#6a57f5;--accent-strong:#553ff3;--accent-soft:rgba(106,87,245,.14);--ease-apple:cubic-bezier(.32,.72,0,1);--dur-base:.18s;--tap-lg:44px}
:root,[data-theme="dark"]{--mat-card:rgba(22,22,27,.9);--mat-hairline:rgba(255,255,255,.1);--t1:#f5f5f7;--t3:#9e9ea8;--shadow-pop:0 8px 30px -8px rgba(0,0,0,.65)}
[data-theme="light"]{--mat-card:rgba(255,255,255,.92);--mat-hairline:rgba(0,0,0,.08);--t1:#211e19;--t3:#726c62;--shadow-pop:0 10px 30px -10px rgba(60,52,40,.28)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--t1);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-strong)}
@keyframes bt-in{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</helmet>

<div style="position:absolute;left:{{ x }};top:{{ y }};width:236px;height:236px;transform:translate(-50%,-50%);animation:bt-in var(--dur-base) var(--ease-apple);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif">

  <div style="position:absolute;inset:0;border-radius:50%;background:var(--mat-card);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--mat-hairline);box-shadow:var(--shadow-pop)"></div>

  <div style="position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--mat-hairline);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);text-align:center;line-height:1.3">{{ nhanGiua }}</div>

  <sc-for list="{{ mon }}" as="m" hint-placeholder-count="6">
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate({{ m.dx }},{{ m.dy }});background:{{ m.nen }};color:{{ m.chu }};border:1px solid {{ m.vien }}">
      <span style="font-size:15px;font-weight:700;line-height:1">{{ m.icon }}</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">{{ m.ten }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;x&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:150,&quot;tsType&quot;:&quot;number&quot;},&quot;y&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:150,&quot;tsType&quot;:&quot;number&quot;},&quot;chon&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:-1,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const chon = this.props.chon ?? -1;
    const raw = [
      { icon: '✎', ten: 'Bút' },
      { icon: '▱', ten: 'Hình' },
      { icon: '⌫', ten: 'Gôm' },
      { icon: '↺', ten: 'Hoàn tác' },
      { icon: '⤢', ten: 'Đo' },
      { icon: 'T', ten: 'Chữ' }
    ];
    const r = 82;
    return {
      x: (this.props.x ?? 0) + 'px',
      y: (this.props.y ?? 0) + 'px',
      nhanGiua: chon >= 0 ? raw[chon].ten : 'trượt\nđể chọn',
      mon: raw.map((m, i) => {
        const a = (-90 + i * 60) * Math.PI / 180;
        const on = i === chon;
        return {
          icon: m.icon, ten: m.ten,
          dx: Math.round(Math.cos(a) * r) + 'px',
          dy: Math.round(Math.sin(a) * r) + 'px',
          nen: on ? 'var(--accent)' : 'transparent',
          chu: on ? '#ffffff' : 'var(--t3)',
          vien: on ? 'var(--accent-strong)' : 'transparent'
        };
      })
    };
  }
}
</script>
</body>
</html>
