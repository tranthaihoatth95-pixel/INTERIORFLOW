<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IF · BangTron</title>
<style>

:root{--accent:#6a57f5;--accent-strong:#553ff3;--accent-soft:rgba(106,87,245,.14);--ease-apple:cubic-bezier(.32,.72,0,1);--dur-base:.18s;--tap-lg:44px}
:root,[data-theme="dark"]{--nen-mo-card:rgba(22,22,27,.9);--vien-mo:rgba(255,255,255,.1);--t1:#f5f5f7;--t3:#9e9ea8;--shadow-pop:0 8px 30px -8px rgba(0,0,0,.65)}
[data-theme="light"]{--nen-mo-card:rgba(255,255,255,.92);--vien-mo:rgba(0,0,0,.08);--t1:#211e19;--t3:#726c62;--shadow-pop:0 10px 30px -10px rgba(60,52,40,.28)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--t1);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-strong)}
@keyframes bt-in{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}

</style>
</head>
<body>
<div style="position:absolute;left:150px;top:150px;width:236px;height:236px;transform:translate(-50%,-50%);animation:bt-in var(--dur-base) var(--ease-apple);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif">

  <div style="position:absolute;inset:0;border-radius:50%;background:var(--nen-mo-card);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--vien-mo);box-shadow:var(--shadow-pop)"></div>

  <div style="position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--vien-mo);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);text-align:center;line-height:1.3">Bút</div>

  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(0px,-82px);background:var(--accent);color:#ffffff;border:1px solid var(--accent-strong)">
      <span style="font-size:15px;font-weight:700;line-height:1">✎</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Bút</span>
    </div>
  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(71px,-41px);background:transparent;color:var(--t3);border:1px solid transparent">
      <span style="font-size:15px;font-weight:700;line-height:1">▱</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Hình</span>
    </div>
  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(71px,41px);background:transparent;color:var(--t3);border:1px solid transparent">
      <span style="font-size:15px;font-weight:700;line-height:1">⌫</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Gôm</span>
    </div>
  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(0px,82px);background:transparent;color:var(--t3);border:1px solid transparent">
      <span style="font-size:15px;font-weight:700;line-height:1">↺</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Hoàn tác</span>
    </div>
  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(-71px,41px);background:transparent;color:var(--t3);border:1px solid transparent">
      <span style="font-size:15px;font-weight:700;line-height:1">⤢</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Đo</span>
    </div>
  
    <div style="position:absolute;left:50%;top:50%;width:var(--tap-lg);height:var(--tap-lg);margin:calc(var(--tap-lg) / -2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:translate(-71px,-41px);background:transparent;color:var(--t3);border:1px solid transparent">
      <span style="font-size:15px;font-weight:700;line-height:1">T</span>
      <span style="font-size:8px;font-weight:600;letter-spacing:.04em;white-space:nowrap">Chữ</span>
    </div>
  </div>
<script>
document.addEventListener('keydown', function (e) {
  if (e.key === 't' || e.key === 'T') {
    var r = document.documentElement
    r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'
  }
})
</script>
</body>
</html>
