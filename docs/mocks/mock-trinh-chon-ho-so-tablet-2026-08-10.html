<!doctype html>
<html lang="vi" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InteriorFlow · Thư viện hồ sơ · desktop và tablet</title>
<!-- Hướng visual: ảnh tham khảo #3 (gallery là trung tâm) + #11 (chọn preset rồi tạo).
  Không dùng sidebar kỹ thuật khi mở chặng 3: người dùng đang chọn một dạng tài liệu, chưa biên tập. -->
<style>
:root{--accent:#6a57f5;--soft:rgba(106,87,245,.14);--bg:#0c0c0e;--panel:#141417;--card:#1a1a1e;--field:#202024;--hover:#2a2a30;--border:#2a2a31;--t1:#f5f5f7;--t2:#d6d6db;--t3:#9e9ea8;--t4:#6e6e78;--ease:cubic-bezier(.32,.72,0,1);font:400 13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}:root[data-theme=light]{--bg:#f2efe9;--panel:#faf8f4;--card:#fff;--field:#f4f1eb;--hover:#e9e5dd;--border:#e3ded4;--t1:#211e19;--t2:#47423a;--t3:#726c62;--t4:#9a938a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -30%,var(--soft),transparent 34%),var(--bg);color:var(--t1);min-height:100vh}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.top{height:42px;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(22px)}.mark{width:24px;height:24px;border:0;border-radius:10px;background:var(--t1);color:var(--bg);font-size:11px;font-weight:800}.crumb{font-size:12px;color:var(--t3)}.crumb b{color:var(--t1)}.sp{flex:1}.top button:not(.mark){height:28px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--field);cursor:pointer;color:var(--t2);font-size:12px}.stagebar{height:48px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}.stages{display:flex;gap:3px;padding:3px;background:var(--field);border-radius:14px}.stages span{padding:5px 14px;color:var(--t3);font-size:12px;border-radius:10px}.stages .on{background:var(--panel);color:var(--t1);font-weight:600;box-shadow:0 2px 8px #0003}
main{max-width:1120px;margin:auto;padding:clamp(38px,7vh,78px) 26px 100px}.eyebrow{display:flex;justify-content:center;align-items:center;gap:7px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}h1{text-align:center;margin:10px 0 6px;font-size:clamp(30px,4vw,43px);line-height:1.08;letter-spacing:-.045em}.lead{max-width:520px;margin:0 auto;text-align:center;color:var(--t3);font-size:15px}.kinds{display:flex;justify-content:center;gap:5px;margin:32px 0 24px;padding-bottom:12px;border-bottom:1px solid var(--border)}.kind{height:34px;border:0;border-radius:10px;padding:0 12px;background:transparent;color:var(--t3);cursor:pointer;font-size:12px}.kind:hover{background:var(--hover);color:var(--t1)}.kind.on{background:var(--soft);color:var(--accent);font-weight:600}.kind small{margin-left:5px;color:inherit;opacity:.7}.templates{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.template{padding:0;border:0;background:transparent;text-align:left;cursor:pointer;min-width:0;transition:transform .2s var(--ease)}.template:hover{transform:translateY(-2px)}.template.on .cover{outline:2px solid var(--accent);outline-offset:3px}.cover{height:185px;border-radius:14px;position:relative;overflow:hidden;background:#34313d;transition:box-shadow .18s var(--ease)}.template:hover .cover{box-shadow:0 14px 32px -20px #000}.cover:after{position:absolute;inset:0;display:grid;place-items:center;padding:18px;color:#fff;font-size:19px;line-height:1.12;font-weight:700}.deck1{background:linear-gradient(145deg,#ad9ffe,#6a57f5 60%,#2e257d)}.deck1:after{content:"Không gian\A có câu chuyện";white-space:pre}.deck2{background:linear-gradient(150deg,#b8aaa0,#574c48)}.deck2:after{content:"Mộc\A Residence";white-space:pre}.deck3{background:linear-gradient(150deg,#a7b7bd,#344b57)}.deck3:after{content:"Phương án\A 02";white-space:pre}.a3{background:linear-gradient(135deg,#e5ddce,#9ab8ad)}.a3:after{content:"BẢNG\A VẬT LIỆU";white-space:pre;color:#282722;font-size:12px}.boq{background:repeating-linear-gradient(0deg,#f3f0ea 0 21px,#c5bfaf 22px 23px),repeating-linear-gradient(90deg,transparent 0 48px,#c5bfaf 48px 49px)}.boq:after{content:"44.20 m²";align-items:end;justify-content:end;color:#6a57f5;font:700 16px ui-monospace,monospace}.text{background:#f3f0ea}.text:after{content:"HỒ SƠ\A THIẾT KẾ";white-space:pre;align-items:start;justify-content:start;color:#5b5346;font-size:12px}.video{background:linear-gradient(135deg,#36414e,#15181e)}.video:after{content:"▶";font-size:34px}.tname{margin-top:12px;font-size:14px;font-weight:600}.meta{margin-top:3px;color:var(--t3);font-size:11px}.selection{position:fixed;z-index:2;left:50%;bottom:22px;transform:translateX(-50%) scale(.98);width:min(720px,calc(100vw - 32px));padding:10px 10px 10px 16px;border:1px solid var(--border);border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(22px);display:flex;align-items:center;gap:14px;box-shadow:0 18px 50px -20px #000;transition:transform .2s var(--ease)}.selection.visible{transform:translateX(-50%) scale(1)}.selcover{width:50px;height:40px;border-radius:8px;flex:none;background:linear-gradient(145deg,#ad9ffe,#6a57f5 60%,#2e257d)}.seltext{min-width:0;flex:1}.seltext b{display:block;font-size:12px}.seltext span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t3);font-size:11px}.create{height:36px;padding:0 15px;border:0;border-radius:10px;background:var(--accent);color:white;font-weight:600;cursor:pointer;white-space:nowrap}.newtemplate{height:185px;border:1px dashed var(--border);border-radius:14px;background:transparent;cursor:pointer;color:var(--t3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}.newtemplate:hover{background:var(--soft);border-color:var(--accent);color:var(--accent)}.newtemplate strong{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;font-size:27px;font-weight:400;line-height:1}.newtemplate span{font-size:12px;font-weight:600}
@media(max-width:780px){main{padding:36px 16px 110px}.crumb{display:none}.top button:first-of-type:not(.mark){display:none}.kinds{justify-content:flex-start;overflow:auto;margin:26px -16px 18px;padding:0 16px 12px}.kind{min-width:max-content;height:44px}.templates{grid-template-columns:repeat(2,1fr);gap:16px 12px}.cover,.newtemplate{height:142px}.selection{bottom:12px;padding:9px 10px}.create{height:42px}.lead{font-size:14px}}@media(max-width:420px){.templates{grid-template-columns:1fr}.cover,.newtemplate{height:125px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><header class="top"><button class="mark">IF</button><span class="crumb">Dự án · Căn hộ Mộc <b>› Trình chiếu</b></span><span class="sp"></span><button>Tìm lệnh ⌘K</button><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Đổi giao diện</button></header><nav class="stagebar"><div class="stages"><span>2D</span><span>3D</span><span class="on">Trình chiếu</span></div></nav><main><div class="eyebrow"><i class="dot"></i> THƯ VIỆN HỒ SƠ</div><h1>Bắt đầu từ một mẫu phù hợp.</h1><p class="lead" id="lead">Tạo một hồ sơ có cấu trúc rõ ràng, rồi biên tập theo dự án của bạn.</p><nav class="kinds" aria-label="Loại hồ sơ"><button class="kind on" data-kind="deck">Deck <small>03</small></button><button class="kind" data-kind="a3">Bảng vật liệu <small>04</small></button><button class="kind" data-kind="boq">Bảng tính BOQ <small>03</small></button><button class="kind" data-kind="text">Văn bản <small>05</small></button><button class="kind" data-kind="video">Video <small>03</small></button></nav><section class="templates" id="templates" aria-label="Mẫu hồ sơ"></section></main><aside class="selection" id="selection"><div class="selcover" id="selcover"></div><div class="seltext"><b id="selname">Concept tối giản</b><span id="seldesc">Mở đầu bằng hình ảnh, ý tưởng và tinh thần không gian.</span></div><button class="create">Dùng mẫu này</button></aside>
<script>const D={deck:{lead:'Tạo một câu chuyện thiết kế rõ ràng, phù hợp cho từng buổi duyệt.',x:[['deck1','Concept tối giản','Mở đầu bằng hình ảnh, ý tưởng và tinh thần không gian.'],['deck2','Hồ sơ khách hàng','Trình bày phương án theo nhịp trang biên tập.'],['deck3','So sánh phương án','Đặt hai hướng thiết kế cạnh nhau để quyết định.']]},a3:{lead:'Ghép vật liệu, mã hàng và vùng sử dụng trên một tấm A3.',x:[['a3','Palette hoàn thiện','Một bảng vật liệu cho từng không gian.'],['a3','Bảng mẫu dự án','Đối chiếu mã hàng và nhà cung cấp.'],['a3','Bề mặt & sắc độ','So sánh các lựa chọn hoàn thiện.']]},boq:{lead:'Dự toán và khối lượng được đọc cùng nhịp với mô hình dự án.',x:[['boq','Khối lượng tổng','Theo dõi đơn giá và tổng giá trị.'],['boq','Dự toán hoàn thiện','Gom nhóm theo hạng mục thi công.'],['boq','Đối chiếu vật tư','So giá và tiến độ đặt hàng.']]},text:{lead:'Văn bản có cấu trúc riêng, không bị nhét vào trang slide.',x:[['text','Thuyết minh thiết kế','Diễn giải ý tưởng và giải pháp.'],['text','Biểu mẫu nghiệm thu','Mẫu kiểm tra theo hạng mục.'],['text','Hợp đồng song ngữ','Khung văn bản dự án quốc tế.']]},video:{lead:'Dựng footage từ chặng 3D thành một nhịp xem có chủ đích.',x:[['video','Walkthrough 60 giây','Đi qua không gian theo một đường kể chuyện.'],['video','Phương án ánh sáng','So sánh các thời điểm trong ngày.'],['video','Tổng hợp dự án','Cắt nhịp cho buổi duyệt ngắn.']]}};let k='deck',s=0;const q=x=>document.querySelector(x);function draw(){let d=D[k],a=d.x[s];q('#lead').textContent=d.lead;q('#selname').textContent=a[1];q('#seldesc').textContent=a[2];q('#selcover').className='selcover '+a[0];q('#templates').innerHTML=d.x.map((v,i)=>`<button class="template ${i===s?'on':''}" data-i="${i}"><div class="cover ${v[0]}"></div><div class="tname">${v[1]}</div><div class="meta">Mở mẫu để bắt đầu</div></button>`).join('')+`<button class="newtemplate" id="new"><strong>＋</strong><span>Tạo hồ sơ trống</span></button>`;document.querySelectorAll('.template').forEach(b=>b.onclick=()=>{s=+b.dataset.i;draw()});q('#new').onclick=()=>{q('#selname').textContent='Hồ sơ trống';q('#seldesc').textContent='Bắt đầu không cần form, rồi thêm nội dung theo ý bạn.';q('#selcover').className='selcover'}}document.querySelectorAll('.kind').forEach(b=>b.onclick=()=>{k=b.dataset.kind;s=0;document.querySelectorAll('.kind').forEach(x=>x.classList.toggle('on',x===b));draw()});draw();</script></body></html>
