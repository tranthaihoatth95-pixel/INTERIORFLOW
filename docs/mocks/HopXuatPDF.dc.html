<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--accent:#6a57f5;--accent-strong:#553ff3;--accent-soft:rgba(106,87,245,.14);--ease-apple:cubic-bezier(.32,.72,0,1);--dur-fast:.12s;--dur-base:.18s;--tap:32px;--tap-lg:44px;--on-accent:#ffffff;
  --paper:#f7f5f0; --paper-edge:#d8d2c6; --paper-ink:#2a251d; --paper-thin:rgba(42,37,29,.34);
  --ok:#46b876; --warn:#d9a34a;
}
:root,[data-theme="dark"]{--panel:#141417;--card:#1a1a1e;--field:#202024;--hover:#2a2a30;--border:#2a2a31;--border-strong:#3d3d45;--t1:#f5f5f7;--t2:#d6d6db;--t3:#9e9ea8;--t4:#6e6e78;--t5:#4e4e57;--scrim:rgba(6,6,8,.62);--shadow-pop:0 8px 30px -8px rgba(0,0,0,.65)}
[data-theme="light"]{--panel:#faf8f4;--card:#ffffff;--field:#f4f1eb;--hover:#e9e5dd;--border:#e3ded4;--border-strong:#cbc4b6;--t1:#211e19;--t2:#47423a;--t3:#726c62;--t4:#9a938a;--t5:#b8b1a7;--scrim:rgba(120,110,95,.3);--shadow-pop:0 10px 30px -10px rgba(60,52,40,.22)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--t1);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-strong)}
</style>
</helmet>

<div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif">
  <div style="width:min(680px,100%);border-radius:20px;background:var(--panel);border:1px solid var(--border-strong);box-shadow:var(--shadow-pop);overflow:hidden;display:flex;flex-direction:column">

    <div style="height:var(--tap-lg);flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--card)">
      <span style="width:26px;height:26px;border-radius:9px;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"><path d="M4 2.5h5l3 3v8H4z"></path><path d="M6 9h4M6 11h4"></path></svg></span>
      <span style="flex:1;font-size:13.5px;font-weight:600;letter-spacing:-.01em">Xuất PDF — 3 tờ</span>
      <button title="Đóng — Esc" style="width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:var(--t4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast) var(--ease-apple)" style-hover="background:var(--hover);color:var(--t1)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 258px;min-height:0">

      <div style="padding:16px;display:flex;align-items:center;justify-content:center;background:var(--field);border-right:1px solid var(--border)">
        <div style="position:relative;width:100%;max-width:330px;aspect-ratio:{{ tiLe }};background:var(--paper);border:1px solid var(--paper-edge);box-shadow:0 12px 30px -14px rgba(0,0,0,.6)">
          <div style="position:absolute;left:4%;top:5%;right:4%;bottom:5%;border:1px dashed var(--paper-thin)"></div>
          <div style="position:absolute;left:7%;top:9%;width:46%;height:50%;border:1.4px solid var(--paper-ink)"></div>
          <div style="position:absolute;left:7%;top:63%;width:46%;height:22%;border:1px solid var(--paper-thin)"></div>
          <div style="position:absolute;left:57%;top:9%;width:22%;height:22%;border:1px solid var(--paper-thin)"></div>
          <div style="position:absolute;right:4%;bottom:5%;width:38%;height:25%;border:1.4px solid var(--paper-ink);background:rgba(42,37,29,.05)"></div>
          <span style="position:absolute;left:4%;bottom:1.4%;font-family:ui-monospace,Menlo,monospace;font-size:8px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-thin)">{{ nhanXem }}</span>
        </div>
      </div>

      <div style="padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0">

        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);margin-bottom:7px">Khổ giấy</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">
            <sc-for list="{{ khoList }}" as="k" hint-placeholder-count="4">
              <button onClick="{{ k.chon }}" style="height:var(--tap);border:1px solid {{ k.vien }};border-radius:9px;background:{{ k.nen }};color:{{ k.chu }};font-weight:700;font-size:11px;line-height:1.45;font-family:ui-monospace,Menlo,monospace;cursor:pointer;transition:background var(--dur-base) var(--ease-apple)">{{ k.ten }}</button>
            </sc-for>
          </div>
          <div style="display:flex;gap:5px;margin-top:5px">
            <button onClick="{{ chonNgang }}" style="flex:1;height:var(--tap);border:1px solid {{ vienNgang }};border-radius:9px;background:{{ nenNgang }};color:{{ chuNgang }};font-weight:600;font-size:11.5px;line-height:1.45;font-family:inherit;cursor:pointer">Ngang</button>
            <button onClick="{{ chonDoc }}" style="flex:1;height:var(--tap);border:1px solid {{ vienDoc }};border-radius:9px;background:{{ nenDoc }};color:{{ chuDoc }};font-weight:600;font-size:11.5px;line-height:1.45;font-family:inherit;cursor:pointer">Dọc</button>
          </div>
        </div>

        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);margin-bottom:7px">Tỉ lệ in</div>
          <div style="height:var(--tap);border:1px solid var(--border);border-radius:9px;background:var(--field);display:flex;align-items:center;justify-content:space-between;padding:0 10px">
            <span style="font-size:12px;color:var(--t2)">Theo tỉ lệ từng khung nhìn</span>
            <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:600;color:var(--ok)">1:1 giấy</span>
          </div>
        </div>

        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);margin-bottom:7px">Trước khi xuất</div>
          <div style="display:flex;flex-direction:column;gap:5px">
            <sc-for list="{{ kiem }}" as="c" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t2);line-height:1.5">
                <span style="width:14px;height:14px;flex:none;border-radius:5px;background:{{ c.nen }};display:flex;align-items:center;justify-content:center;color:{{ c.chu }};font-size:9px;font-weight:800">{{ c.dau }}</span>
                <span style="min-width:0">{{ c.ten }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
          <button style="width:100%;height:var(--tap-lg);border:0;border-radius:11px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:13px;line-height:1.45;font-family:inherit;cursor:pointer;transition:background var(--dur-base) var(--ease-apple)" style-hover="background:var(--accent-strong)">Xuất 3 tờ ra PDF</button>
          <button style="width:100%;height:30px;border:1px solid var(--border);border-radius:10px;background:var(--field);color:var(--t2);font-weight:600;font-size:11px;line-height:1.45;font-family:inherit;cursor:pointer">Chỉ xuất tờ đang mở</button>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:480}}">
class Component extends DCLogic {
  state = { kho: 'A3', doc: false };
  renderVals() {
    const s = this.state;
    const canh = { A0: [1189, 841], A1: [841, 594], A2: [594, 420], A3: [420, 297] }[s.kho];
    const [d, n] = s.doc ? [canh[1], canh[0]] : canh;
    const on = (b) => ({
      nen: b ? 'var(--accent-soft)' : 'var(--field)',
      vien: b ? 'var(--accent)' : 'var(--border)',
      chu: b ? 'var(--accent)' : 'var(--t3)'
    });
    const kiem = [
      { ten: 'PURGE bản vẽ — đã chạy', ok: true },
      { ten: 'Về gốc toạ độ 0,0 — đã đưa', ok: true },
      { ten: 'Layer và màu đúng bảng nét', ok: true },
      { ten: 'VP-02 chưa khoá — tỉ lệ có thể lệch', ok: false },
      { ten: 'Cỡ chữ và dim theo từng tỉ lệ', ok: true }
    ];
    return {
      tiLe: d + ' / ' + n,
      nhanXem: s.kho + ' · ' + (s.doc ? 'dọc' : 'ngang') + ' · tờ 1 / 3',
      khoList: ['A0', 'A1', 'A2', 'A3'].map(k => Object.assign({ ten: k, chon: () => this.setState({ kho: k }) }, on(k === s.kho))),
      chonNgang: () => this.setState({ doc: false }),
      chonDoc: () => this.setState({ doc: true }),
      nenNgang: on(!s.doc).nen, vienNgang: on(!s.doc).vien, chuNgang: on(!s.doc).chu,
      nenDoc: on(s.doc).nen, vienDoc: on(s.doc).vien, chuDoc: on(s.doc).chu,
      kiem: kiem.map(c => ({
        ten: c.ten,
        dau: c.ok ? '✓' : '!',
        nen: c.ok ? 'var(--ok)' : 'var(--warn)',
        chu: '#0c0c0e'
      }))
    };
  }
}
</script>
</body>
</html>
