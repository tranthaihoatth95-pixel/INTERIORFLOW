<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --accent:#6a57f5; --accent-strong:#553ff3; --accent-soft:rgba(106,87,245,.14);
  --ease-apple:cubic-bezier(.32,.72,0,1);
}
:root,[data-theme="dark"]{
  --bg:#0c0c0e; --panel:#141417; --card:#1a1a1e; --field:#202024; --hover:#2a2a30;
  --border:#2a2a31; --border-strong:#3d3d45;
  --t1:#f5f5f7; --t2:#d6d6db; --t3:#9e9ea8; --t4:#6e6e78; --t5:#4e4e57;
  --mat-panel:rgba(20,20,23,.82); --mat-hairline:rgba(255,255,255,.06);
  --shadow-pop:0 8px 30px -8px rgba(0,0,0,.65); --shadow-node:0 6px 20px -8px rgba(0,0,0,.6);
  --success:#46b876; --scrim:rgba(6,6,8,.62);
}
[data-theme="light"]{
  --bg:#f2efe9; --panel:#faf8f4; --card:#ffffff; --field:#f4f1eb; --hover:#e9e5dd;
  --border:#e3ded4; --border-strong:#cbc4b6;
  --t1:#211e19; --t2:#47423a; --t3:#726c62; --t4:#9a938a; --t5:#b8b1a7;
  --mat-panel:rgba(250,248,244,.86); --mat-hairline:rgba(0,0,0,.05);
  --shadow-pop:0 10px 30px -10px rgba(60,52,40,.22); --shadow-node:0 6px 18px -8px rgba(60,52,40,.2);
  --scrim:rgba(120,110,95,.28);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-strong)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--bg);padding:36px 40px 64px;font:400 14px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;color:var(--t1)">

  <div style="width:1180px;margin:0 auto 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px">
    <div style="min-width:0">
      <div style="display:flex;align-items:center;gap:11px">
        <div style="width:26px;height:26px;border-radius:8px;background:var(--accent);flex:none"></div>
        <h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em">Ảnh đại diện</h1>
        <span style="display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:6px;background:var(--field);color:var(--t4);font-size:9px;font-weight:700;letter-spacing:.03em">PLACEHOLDER</span>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--t3);max-width:820px;text-wrap:pretty">Cửa sổ nổi giữa màn. Người dùng tự ghép hình đại diện, chỉ phần đầu. Mọi ô bấm được rộng 44 điểm ảnh.</div>
    </div>
    <button onClick="{{ toggleTheme }}" style="height:32px;padding:0 16px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--t2);font:600 12px inherit;cursor:pointer;flex:none;transition:background .18s var(--ease-apple)" style-hover="background:var(--hover);color:var(--t1)">{{ themeLabel }}</button>
  </div>

  <div style="width:1180px;margin:0 auto;height:820px;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-pop);background:var(--scrim);display:flex;align-items:center;justify-content:center;position:relative">
    <div style="position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.045) 0 1px,transparent 1.4px);background-size:26px 26px"></div>

    
</x-dc>
</body>
</html>
