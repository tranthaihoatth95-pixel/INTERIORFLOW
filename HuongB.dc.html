<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    a { color: #6a57f5; } a:hover { color: #5646d6; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #f7f6f3; color: #22201c;">

  <!-- HƯỚNG B — CÔNG TRÌNH LÀ NHÂN VẬT CHÍNH.
       Khác hướng A ở TRỤC: A lấy KHOẢNG TRỐNG làm vật liệu (phòng trống, một lối vào);
       B lấy CÔNG VIỆC GẦN NHẤT làm nền môi trường — ảnh/bản vẽ của chính dự án phủ toàn trường,
       chữ nổi trên đó. Trống ít hơn, ấm hơn, và trả lời ngay "tôi đang dở cái gì". -->
  <div style="position: absolute; inset: 0; background:
      linear-gradient(180deg, rgba(242,242,247,0) 46%, rgba(242,242,247,.93) 82%, #f7f6f3 100%),
      radial-gradient(70% 55% at 72% 28%, #dfe0ea 0%, rgba(223,224,234,0) 70%),
      linear-gradient(150deg, #eceef4 0%, #e4e5ee 52%, #eeeff4 100%);"></div>
  <!-- gợi ý mặt bằng của dự án gần nhất, rất mờ — đây là NỀN, không phải widget -->
  <div style="position: absolute; inset: 0; opacity: .5;">
    <svg width="100%" height="100%" viewBox="0 0 1440 900" fill="none" stroke="#8e90a8" stroke-width="1">
      <rect x="520" y="150" width="520" height="360" rx="2" stroke-opacity=".5"/>
      <path d="M520 330h230M750 150v180M750 400h290M880 330v180" stroke-opacity=".38"/>
      <rect x="556" y="186" width="150" height="106" rx="2" stroke-opacity=".3"/>
      <circle cx="960" cy="250" r="42" stroke-opacity=".28"/>
      <path d="M520 510h520M1040 150v360" stroke-opacity=".22"/>
    </svg>
  </div>

  <!-- thanh trên, y hệt hướng A -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 20px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22201c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8v8M8 8h5M8 12h4"/></svg>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: -.01em;">InteriorFlow</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px; border-radius: 999px; color: #96918a; font-size: 12.5px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Hỏi hoặc tìm</span>
    </div>
    <div style="width: 26px; height: 26px; border-radius: 999px; background: linear-gradient(140deg,#cfcfe0,#a9a9c2);"></div>
  </div>

  <!-- rail y hệt hướng A — vỏ dùng chung, chỉ nội dung khác -->
  <div style="position: absolute; left: 0; top: 52px; bottom: 0; width: 52px; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-left: 6px; box-sizing: border-box;">
    <div style="background: rgba(249,249,251,.86); border: 1px solid #e6e3dd; border-radius: 14px; padding: 5px 0; display: flex; flex-direction: column; gap: 2px;">
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;border-radius:10px;background:rgba(106,87,245,.10);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a57f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m15 9-4 1.5L9.5 15 14 13.5z"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h4v14H4zM10 5h4v14h-4zM17 6l3 12"/></svg></div>
    </div>
    <div style="background: rgba(249,249,251,.86); border: 1px solid #e6e3dd; border-radius: 14px; padding: 5px 0; display: flex; flex-direction: column; gap: 2px;">
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6e6a62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/></svg></div>
      <div style="width:40px;height:36px;display:grid;place-items:center;margin:0 3px;border-radius:10px;border:1px solid rgba(106,87,245,.34);background:rgba(106,87,245,.07);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a57f5" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    </div>
  </div>

  <!-- Nội dung neo ĐÁY — công trình chiếm nửa trên, chữ nằm dưới nó -->
  <div style="position: absolute; left: 168px; bottom: 132px; width: 780px;">
    <div style="font-size: 12.5px; color: #6e6a62; letter-spacing: .04em; margin-bottom: 14px;">CHÀO HOÀ · THỨ TƯ, 26 THÁNG 8</div>
    <div style="font-size: 15px; color: #6e6a62; margin-bottom: 6px;">Gần đây nhất</div>
    <div style="font-size: 40px; font-weight: 300; letter-spacing: -.022em; line-height: 1.16;">Căn hộ mẫu · Studio 48m²</div>
    <div style="display: flex; align-items: center; gap: 14px; margin-top: 26px;">
      <div style="display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 22px; border-radius: 999px; background: #6a57f5; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 8px 22px -12px rgba(60,44,170,.55), inset 0 1px 0 rgba(255,255,255,.18);">
        <span>Mở lại</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 18px; border-radius: 999px; border: 1px solid #c9c5bc; color: #46433d; font-size: 13.5px;">Dự án mới</div>
      <div style="font-size: 13px; color: #96918a;">2 hồ sơ khác</div>
    </div>
  </div>

  <div style="position: absolute; right: 42px; bottom: 132px; width: 260px; text-align: right;">
    <div style="font-size: 11.5px; color: #96918a; letter-spacing: .06em; margin-bottom: 10px;">GHI CHÚ</div>
    <div style="font-size: 13.5px; color: #6e6a62; line-height: 1.65;">kiểm lại cao độ sau khi tách<br>chỗ này cần kiểm lại cao độ</div>
  </div>

</div>
</x-dc>
</body>
</html>
